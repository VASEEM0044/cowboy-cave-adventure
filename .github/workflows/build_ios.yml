name: Build iOS Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis & tests
        run: |
          dart analyze
          flutter test

      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package App into IPA (Payload Archive)
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 CowboyCaveAdventure.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CowboyCaveAdventure-iOS-IPA
          path: build/ios/iphoneos/CowboyCaveAdventure.ipa
          retention-days: 14
